# ============================================================================
#  MISE À JOUR AUTOMATIQUE — exécutée sur les serveurs de GitHub
# ============================================================================
#  Aucun ordinateur à laisser allumé : tout se passe ici, gratuitement.
#
#  Déclencheurs :
#    · toutes les 3 h à :30 (06:30 UTC = 07:30 à Cotonou, Bénin — UTC+1)
#    · à chaque poussée sur main
#    · à la demande, via le bouton « Run workflow » de l'onglet Actions
#
#  Durée typique : 3 à 6 minutes (l'aspiration NHL et NBA est la plus longue).
# ============================================================================

name: Mise à jour multi-sports

on:
  schedule:
    # GitHub travaille en UTC. 06:30 UTC = 07:30 au Bénin, puis toutes les 3 h.
    - cron: '30 */3 * * *'
  workflow_dispatch:            # bouton « Run workflow »
  push:
    branches: [ main, 'arena/01a06d4c-impactgames' ]

permissions:
  # `contents: write` est indispensable : l'étape « Rapatrier le rapport »
  # re-commit data/rapport-execution.json et data/tests.log sur la branche.
  # Avec `contents: read`, `git push` échouait silencieusement (l'erreur était
  # avalée par le `|| echo`) et un échec de tests devenait indiagnosticable.
  contents: write
  pages: write
  id-token: write

# une seule exécution à la fois : la plus ancienne s'arrête
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les bibliothèques de calcul
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # L'archive tennis pèse ~55 Mo et l'historique NHL/NBA quelques Mo.
      # On les conserve d'une exécution à l'autre plutôt que de tout reprendre.
      - name: Restaurer les données de la dernière exécution
        uses: actions/cache@v4
        with:
          path: data
          key: donnees-v1-${{ github.run_id }}
          restore-keys: |
            donnees-v1-

      - name: Télécharger, entraîner, construire le calendrier
        run: python maj.py
        # maj.py n'écrase jamais rien en cas de source injoignable, et un sport
        # en échec n'empêche pas les deux autres d'être publiés.

      - name: Contrôle qualité — la suite de tests doit passer
        run: |
          mkdir -p data
          set -o pipefail
          # La sortie est conservée dans data/tests.log : les journaux Actions
          # ne sont pas téléchargeables de partout, et sans elle un échec en CI
          # est impossible à diagnostiquer à distance.
          {
            python -m unittest discover -s tests -v
            echo "PYTHON_EXIT=$?"
            node tests/test_app.js
            echo "NODE_EXIT=$?"
          } 2>&1 | tee data/tests.log
          # En cas d'échec, on commit le journal AVANT de sortir : l'étape de
          # rapatriement ne s'exécute pas toujours, et sans ce fichier un échec
          # en CI est impossible à diagnostiquer à distance.
          if ! grep -q "^PYTHON_EXIT=0$" data/tests.log \
             || ! grep -q "^NODE_EXIT=0$" data/tests.log; then
            cp data/tests.log /tmp/tests.log
            git config user.name  "impactgames-bot"
            git config user.email "bot@users.noreply.github.com"
            cp /tmp/tests.log data/tests.log
            git add -f data/tests.log || true
            git commit -m "Journal des tests en échec [skip ci]" || true
            git push origin HEAD:refs/heads/${{ github.ref_name }} || \
              echo "journal non poussé"
            grep -q "^PYTHON_EXIT=0$" data/tests.log || { echo "TESTS PYTHON EN ÉCHEC"; exit 1; }
            echo "TEST DE RENDU EN ÉCHEC"; exit 1
          fi
        # Si un test casse, on NE PUBLIE PAS. Mieux vaut une application
        # datée d'une heure qu'une application fausse.

      - name: Vérifier que le fichier est publiable
        run: |
          test -f impactgames-autonome.html || { echo "FICHIER ABSENT"; exit 1; }
          SIZE=$(stat -c%s impactgames-autonome.html)
          echo "Taille : $SIZE octets"
          if [ "$SIZE" -lt 40000 ]; then echo "TROP PETIT"; exit 1; fi
          if [ "$SIZE" -gt 8000000 ]; then echo "TROP GROS"; exit 1; fi
          grep -q "const DATA = " impactgames-autonome.html || { echo "DONNÉES ABSENTES"; exit 1; }
          grep -q "__DATA__" impactgames-autonome.html && { echo "ESPACE NON REMPLACÉ"; exit 1; }
          echo "Vérifications passées."

      - name: Préparer le dossier à publier
        run: |
          mkdir -p site
          # GitHub Pages sert index.html à la racine : l'adresse reste propre
          cp impactgames-autonome.html site/index.html
          cp impactgames-autonome.html site/impactgames-autonome.html
          cp README.md site/README.md 2>/dev/null || true
          cp CONCEPTION.md site/CONCEPTION.md 2>/dev/null || true

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Pages n'est pas encore activé sur ce dépôt : on l'active nous-mêmes
          # au lieu de faire échouer le déploiement (droit pages: write).
          enablement: true

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4

      # Les journaux Actions ne sont pas téléchargeables de partout : on
      # re-commit un petit rapport pour pouvoir lire ce qui s'est VRAIMENT passé.
      - name: Rapatrier le rapport d'exécution
        if: always()
        run: |
          git config user.name  "impactgames-bot"
          git config user.email "bot@users.noreply.github.com"
          # fichier par fichier : `git add -f a b` échoue EN BLOC si `a` manque,
          # ce qui faisait silently disparaître tests.log du commit
          for f in data/rapport-execution.json data/tests.log; do
            if [ -f "$f" ]; then git add -f "$f"; else echo "absent : $f"; fi
          done
          echo "--- index ---"; git status --short
          if ! git diff --cached --quiet; then
            git commit -m "Rapport d'exécution [skip ci]"
            # actions/checkout laisse un HEAD DÉTACHÉ : `git push origin HEAD`
            # n'aboutit nulle part. Il faut viser la branche explicitement.
            git push origin HEAD:refs/heads/${{ github.ref_name }} || \
              echo "rapport non poussé (permissions ?)"
          else
            echo "rapport inchangé"
          fi

      - name: Récapitulatif
        if: always()
        run: |
          echo "## Résultat de la mise à jour" >> $GITHUB_STEP_SUMMARY
          if [ -f data/maj.log ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -25 data/maj.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "L'application est disponible quelques secondes après la fin," >> $GITHUB_STEP_SUMMARY
          echo "à l'adresse indiquée dans Settings → Pages." >> $GITHUB_STEP_SUMMARY
