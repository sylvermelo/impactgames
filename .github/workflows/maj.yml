# ============================================================================
#  MISE À JOUR AUTOMATIQUE — exécutée sur les serveurs de GitHub
# ============================================================================
#  Aucun ordinateur à laisser allumé : tout se passe ici, gratuitement.
#
#  Déclencheurs :
#    · toutes les 3 h à :30 (06:30 UTC = 07:30 à Cotonou, Bénin — UTC+1)
#    · à chaque poussée sur main
#    · à la demande, via le bouton « Run workflow » de l'onglet Actions
#
#  Durée typique : 3 à 6 minutes (l'aspiration NHL et NBA est la plus longue).
# ============================================================================

name: Mise à jour multi-sports

on:
  schedule:
    # GitHub travaille en UTC. 06:30 UTC = 07:30 au Bénin, puis toutes les 3 h.
    - cron: '30 */3 * * *'
  workflow_dispatch:            # bouton « Run workflow »
  push:
    branches: [ main, 'arena/01a06d4c-impactgames' ]

permissions:
  # `contents: write` est indispensable : l'étape « Rapatrier le rapport »
  # re-commit data/rapport-execution.json et data/tests.log sur la branche.
  # Avec `contents: read`, `git push` échouait silencieusement (l'erreur était
  # avalée par le `|| echo`) et un échec de tests devenait indiagnosticable.
  contents: write
  pages: write
  # La doc GitHub est explicite : créer un site Pages demande « Pages (write) »
  # ET « Administration (write) ». Sans le second, POST /repos/.../pages renvoie
  # 403 « Resource not accessible by integration » (constaté dans data/pages.log
  # du run 33912833022).
  administration: write
  id-token: write

# une seule exécution à la fois : la plus ancienne s'arrête
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les bibliothèques de calcul
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # L'archive tennis pèse ~55 Mo et l'historique NHL/NBA quelques Mo.
      # On les conserve d'une exécution à l'autre plutôt que de tout reprendre.
      - name: Restaurer les données de la dernière exécution
        uses: actions/cache@v4
        with:
          path: data
          key: donnees-v1-${{ github.run_id }}
          restore-keys: |
            donnees-v1-

      - name: Télécharger, entraîner, construire le calendrier
        run: python maj.py
        # maj.py n'écrase jamais rien en cas de source injoignable, et un sport
        # en échec n'empêche pas les deux autres d'être publiés.

      - name: Contrôle qualité — la suite de tests doit passer
        run: |
          mkdir -p data
          set -o pipefail
          # La sortie est conservée dans data/tests.log : les journaux Actions
          # ne sont pas téléchargeables de partout, et sans elle un échec en CI
          # est impossible à diagnostiquer à distance.
          {
            python -m unittest discover -s tests -v
            echo "PYTHON_EXIT=$?"
            node tests/test_app.js
            echo "NODE_EXIT=$?"
          } 2>&1 | tee data/tests.log
          # En cas d'échec, on commit le journal AVANT de sortir : l'étape de
          # rapatriement ne s'exécute pas toujours, et sans ce fichier un échec
          # en CI est impossible à diagnostiquer à distance.
          if ! grep -q "^PYTHON_EXIT=0$" data/tests.log \
             || ! grep -q "^NODE_EXIT=0$" data/tests.log; then
            cp data/tests.log /tmp/tests.log
            git config user.name  "impactgames-bot"
            git config user.email "bot@users.noreply.github.com"
            cp /tmp/tests.log data/tests.log
            git add -f data/tests.log || true
            git commit -m "Journal des tests en échec [skip ci]" || true
            git push origin HEAD:refs/heads/${{ github.ref_name }} || \
              echo "journal non poussé"
            grep -q "^PYTHON_EXIT=0$" data/tests.log || { echo "TESTS PYTHON EN ÉCHEC"; exit 1; }
            echo "TEST DE RENDU EN ÉCHEC"; exit 1
          fi
        # Si un test casse, on NE PUBLIE PAS. Mieux vaut une application
        # datée d'une heure qu'une application fausse.

      - name: Vérifier que le fichier est publiable
        run: |
          test -f impactgames-autonome.html || { echo "FICHIER ABSENT"; exit 1; }
          SIZE=$(stat -c%s impactgames-autonome.html)
          echo "Taille : $SIZE octets"
          if [ "$SIZE" -lt 40000 ]; then echo "TROP PETIT"; exit 1; fi
          if [ "$SIZE" -gt 8000000 ]; then echo "TROP GROS"; exit 1; fi
          grep -q "const DATA = " impactgames-autonome.html || { echo "DONNÉES ABSENTES"; exit 1; }
          grep -q "__DATA__" impactgames-autonome.html && { echo "ESPACE NON REMPLACÉ"; exit 1; }
          echo "Vérifications passées."

      - name: Préparer le dossier à publier
        run: |
          mkdir -p site
          # GitHub Pages sert index.html à la racine : l'adresse reste propre
          cp impactgames-autonome.html site/index.html
          cp impactgames-autonome.html site/impactgames-autonome.html
          cp README.md site/README.md 2>/dev/null || true
          cp CONCEPTION.md site/CONCEPTION.md 2>/dev/null || true

      # Les sources NBA renvoient 403 depuis les serveurs de GitHub : on sonde
      # plusieurs hôtes (avec un User-Agent de navigateur ET le nôtre) et on
      # écrit les codes dans data/sonde.log, re-committé par « Rapatrier ».
      - name: Sonder les sources de basket
        continue-on-error: true
        run: |
          UA_NAV="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          UA_BOT="Mozilla/5.0 (compatible; impactgames/1.0)"
          : > data/sonde.log
          sonde() {
            for ua in "$UA_NAV" "$UA_BOT"; do
              tag=bot; [ "$ua" = "$UA_NAV" ] && tag=nav
              code=$(curl -sS -o /dev/null -m 20 -w '%{http_code}' \
                       -A "$ua" "$1" 2>/dev/null || echo ERR)
              printf '%-5s %-4s %-22s %s\n' "$code" "$tag" "$2" "$1" >> data/sonde.log
            done
          }
          sonde "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=20250110&limit=5" "espn-site"
          sonde "https://site.web.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=20250110&limit=5" "espn-site-web"
          sonde "https://sports.core.api.espn.com/v2/sports/basketball/leagues/nba/seasons/2025/types/2/teams/2/events?limit=2" "espn-core"
          sonde "https://cdn.nba.com/static/json/staticData/scheduleLeagueV2_1.json" "cdn-nba"
          sonde "https://data.nba.net/10s/prod/v1/2024/scoreboard.json" "data-nba-net"
          sonde "https://stats.nba.com/stats/leaguegamefinder?LeagueID=00&Season=2024-25&SeasonType=Regular%20Season&PlayerOrTeam=T" "stats-nba"
          sonde "https://www.thesportsdb.com/api/v1/json/3/eventspastleague.php?id=4387" "tsdb-past"
          sonde "https://www.thesportsdb.com/api/v1/json/123/eventsseason.php?id=4387&season=2024-2025" "tsdb-season"
          sonde "https://api.balldontlie.io/v1/games?per_page=1" "balldontlie"
          sonde "https://www.basketball-reference.com/leagues/NBA_2025_games.html" "basketball-ref"
          sonde "https://api.nhle.com/stats/rest/en/game?limit=1" "temoin-nhle"
          sonde "https://api-web.nhle.com/v1/schedule/2025-01-10" "temoin-nhle-web"
          sonde "https://raw.githubusercontent.com/Kadantte/tennis_atp/master/README.md" "temoin-raw-github"
          echo "----- data/sonde.log -----"; cat data/sonde.log

      - name: Configurer GitHub Pages
        id: pages
        # On ne s'arrête pas ici : si Pages refuse, on veut d'abord écrire POURQUOI
        # dans data/pages.log, que l'étape « Rapatrier » re-committera. Les
        # journaux Actions ne sont pas téléchargeables de partout.
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          # Pages n'est pas encore activé sur ce dépôt : on l'active nous-mêmes
          # au lieu de faire échouer le déploiement (droit pages: write).
          enablement: true

      - name: Expliquer pourquoi Pages a refusé
        if: steps.pages.outcome == 'failure'
        run: |
          {
            echo "=== état de Pages sur ce dépôt ==="
            curl -sS -w '\nHTTP %{http_code}\n' \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages"
            echo
            echo "=== tentative d'activation (build_type: workflow) ==="
            curl -sS -w '\nHTTP %{http_code}\n' -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              -d '{"build_type":"workflow"}' \
              "https://api.github.com/repos/${{ github.repository }}/pages"
            echo
            echo "=== droits réellement accordés au jeton ==="
            curl -sS -D - -o /dev/null \
              -H "Authorization: Bearer ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}" \
              | grep -i '^x-oauth-scopes\|^x-accepted-github-permissions' || true
          } > data/pages.log 2>&1
          echo "----- data/pages.log -----"; cat data/pages.log

      - name: Envoyer le site
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publier
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4

      # Les journaux Actions ne sont pas téléchargeables de partout : on
      # re-commit un petit rapport pour pouvoir lire ce qui s'est VRAIMENT passé.
      - name: Rapatrier le rapport d'exécution
        if: always()
        run: |
          git config user.name  "impactgames-bot"
          git config user.email "bot@users.noreply.github.com"
          # fichier par fichier : `git add -f a b` échoue EN BLOC si `a` manque,
          # ce qui faisait silently disparaître tests.log du commit
          for f in data/rapport-execution.json data/tests.log data/pages.log data/sonde.log; do
            if [ -f "$f" ]; then git add -f "$f"; else echo "absent : $f"; fi
          done
          echo "--- index ---"; git status --short
          if ! git diff --cached --quiet; then
            git commit -m "Rapport d'exécution [skip ci]"
            # actions/checkout laisse un HEAD DÉTACHÉ : `git push origin HEAD`
            # n'aboutit nulle part. Il faut viser la branche explicitement.
            git push origin HEAD:refs/heads/${{ github.ref_name }} || \
              echo "rapport non poussé (permissions ?)"
          else
            echo "rapport inchangé"
          fi

      - name: Récapitulatif
        if: always()
        run: |
          echo "## Résultat de la mise à jour" >> $GITHUB_STEP_SUMMARY
          if [ -f data/maj.log ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -25 data/maj.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            echo "Site publié : https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ GitHub Pages n'est pas activé" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Les données sont à jour, mais le site n'est pas en ligne." >> $GITHUB_STEP_SUMMARY
            echo "À faire une fois : Settings → Pages → Source « GitHub Actions »." >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 data/pages.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Les données sont sauvegardées ; on échoue pour que l'absence de
            # publication reste visible dans la liste des exécutions.
            exit 1
          fi
